[package]
name = "vestra-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
# Forward-only switch: preserves the regular CLI's dependency surface unless a
# reproducibility run explicitly requests the pinned oneDNN experiment.
onednn-experiment = ["da-engine/onednn-experiment"]

[[bin]]
name = "vestra-engine"
path = "src/main.rs"

[dependencies]
da-engine = { package = "vestra-engine", path = "../da-engine" }
clap.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
